# =============================================================================
# bondy_mst — Linux bench substrate on Fly.io
#
# This fly.toml lives at the repo root (not under bench/fly/) because
# flyctl resolves the `[build].dockerfile` path AND the upload build
# context relative to this file's directory. Since the Dockerfile's
# `COPY . /opt/bondy_mst` needs the project source (src/, justfile,
# bench/mix.exs, etc.), the only way to get the right context is to
# put fly.toml here. All other Fly assets — Dockerfile, entrypoint,
# README — stay under bench/fly/.
#
# Drive via the project's `just bench-fly-*` recipes. See
# bench/fly/README.md for the operator runbook and
# _design/latest/PACK_STORE_WRITE_PATH_FLOOR_BENCH_PLAN.md §10 for
# the bench plan context.
#
# Cost: ~$1.50/month standing (volume) + ~$0.10 per 2h bench run.
# `just bench-fly-down` after every session to keep idle cost
# volume-only.
# =============================================================================

app = 'bondy-mst-bench'
primary_region = 'lhr'

[build]
  dockerfile = 'bench/fly/Dockerfile'

  # OTP + Elixir versions are baked into the hexpm/elixir base image
  # tag (see bench/fly/Dockerfile FROM line). Re-pin the FROM tag,
  # not these args, when production OTP is fixed.
  [build.args]
    REBAR3_VERSION = '3.24.0'
    JUST_VERSION = '1.36.0'

[deploy]
  strategy = 'immediate'

[[mounts]]
  source = 'bench_data'
  destination = '/data'
  initial_size = '10gb'

[[vm]]
  size = 'performance-2x'
  cpu_kind = 'performance'
  cpus = 2
  memory_mb = 4096

# Cost control — stop when idle, restart on demand. Bench runs are
# operator-driven (`fly ssh console` and the `bench-fly-*` recipes
# will wake the machine); between runs the machine is stopped and
# we only pay for the volume.
[machine]
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
